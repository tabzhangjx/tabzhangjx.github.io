<link rel="stylesheet" href="{{ '/assets/css/report-shell.css' | relative_url }}?v=20261028">
<nav class="report-nav" aria-label="Report navigation">
  <a class="report-nav__home" href="{{ '/year-archive/' | relative_url }}"><span aria-hidden="true">←</span> Research journal</a>
  <div class="report-nav__controls">
    <a class="report-nav__archive" href="{{ '/tags/' | relative_url }}">Topics</a>
    {% if page.alternate_en %}<a class="report-nav__button" href="{{ page.alternate_en | relative_url }}" lang="en" hreflang="en" aria-label="Read in English">English <span aria-hidden="true">⇄</span></a>{% endif %}
    {% if page.alternate_zh %}<a class="report-nav__button" href="{{ page.alternate_zh | relative_url }}" lang="zh-CN" hreflang="zh-CN" aria-label="切换到中文">中文 <span aria-hidden="true">⇄</span></a>{% endif %}
    <button class="report-nav__button" id="report-theme-control" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span aria-hidden="true">◐</span> <span data-theme-label>Dark</span></button>
  </div>
</nav>
<script src="{{ '/assets/js/report-shell.js' | relative_url }}" defer></script>
