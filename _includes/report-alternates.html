<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.alternate_en %}
<link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.alternate_en | absolute_url }}">
{% elsif page.alternate_zh %}
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="zh-CN" href="{{ page.alternate_zh | absolute_url }}">
{% endif %}
