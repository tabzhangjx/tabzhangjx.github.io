<nav aria-label="Report navigation" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border,#ddd);font:14px system-ui,sans-serif">
  <a href="{{ '/year-archive/' | relative_url }}">Blogs / 博客</a>
  <a href="{{ '/tags/' | relative_url }}">Tags / 标签</a>
  {% for tag in page.tags %}
    <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a>
  {% endfor %}
  {% if page.alternate_en %}<a href="{{ page.alternate_en | relative_url }}" lang="en" hreflang="en">English</a>{% endif %}
  {% if page.alternate_zh %}<a href="{{ page.alternate_zh | relative_url }}" lang="zh-CN" hreflang="zh-CN">中文</a>{% endif %}
</nav>
